name: Refresh roster
on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday
  workflow_dispatch:
    inputs:
      replace_sample:
        description: 'Replace the fictional sample data with the real roster (first run only)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build roster
        run: node scripts/build-roster.mjs ${{ inputs.replace_sample && '--replace-sample' || '' }}
      - run: node --test tests/*.test.js tests/*.test.mjs
      - run: node scripts/validate-data.mjs
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh roster data"
          git push
          # Pushes made with GITHUB_TOKEN do not start other workflows, so start the deploy explicitly.
          gh workflow run pages.yml
