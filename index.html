<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golf Handicap Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>⛳ Golf Handicap Tracker</h1>

    <section class="card index-card">
      <div class="label">Handicap Index</div>
      <div id="index" class="big">—</div>
      <div id="index-note" class="muted">Add at least 3 rounds</div>
    </section>

    <section class="card">
      <h2>Add round</h2>
      <form id="round-form">
        <label>Holes
          <select name="holes"><option value="18">18 holes</option><option value="9">9 holes</option></select>
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Course <input type="text" name="course" required placeholder="Pebble Beach"></label>
        <label>Total score <small>(adjusted gross)</small> <input type="number" name="score" min="9" max="200" required></label>
        <label class="check"><input type="checkbox" id="by-hole"> Enter hole-by-hole</label>
        <div id="holes" class="holes" hidden></div>
        <label><span id="rating-label">Course rating</span> <input type="number" name="rating" step="0.1" min="50" max="85" required></label>
        <label><span id="slope-label">Slope</span> <input type="number" name="slope" min="55" max="155" required></label>
        <label>PCC <small>(optional)</small> <input type="number" name="pcc" step="1" min="-1" max="3" value="0"></label>
        <button type="submit">Add round</button>
      </form>
    </section>

    <section class="card">
      <h2>Course handicap calculator</h2>
      <div class="row">
        <label>Slope <input id="ch-slope" type="number" min="55" max="155"></label>
        <label>Rating <input id="ch-rating" type="number" step="0.1"></label>
        <label>Par <input id="ch-par" type="number" min="27" max="80"></label>
      </div>
      <div>Course handicap: <strong id="ch-result">—</strong></div>
    </section>

    <section class="card">
      <h2>Rounds <small id="count"></small></h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Holes</th><th>Course</th><th>Score</th><th>Rating/Slope</th><th>Diff</th><th></th></tr></thead>
          <tbody id="rounds"></tbody>
        </table>
      </div>
      <p class="muted">Highlighted differentials count toward your index (best of your most recent 20).</p>
      <div class="row">
        <button id="export" type="button" class="secondary">Export JSON</button>
        <label class="file secondary">Import JSON <input id="import" type="file" accept="application/json" hidden></label>
      </div>
    </section>
  </main>
  <script src="handicap.js"></script>
  <script src="app.js"></script>
</body>
</html>
